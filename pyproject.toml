[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emotion-analysis"
version = "0.1.0"
description = "Multi-dimensional emotion analysis of conversational transcripts"
readme = "README_LIBRARY.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "emotion", "sentiment", "nlp", "conversation", "psychology",
    "affective computing", "anthropic", "claude"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
examples = [
    "rich>=13.0",        # pretty terminal output in example scripts
    "matplotlib>=3.8",   # optional visualisation helpers
]

[project.urls]
Repository = "https://github.com/samrahimi/lovegpt"

[tool.hatch.build.targets.wheel]
packages = ["emotion_analysis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
